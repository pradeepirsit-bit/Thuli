<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thuli | Minimalist Toolkit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root { --bg: #fdfdfd; --text: #171717; --accent: #f3f4f6; --primary: #000000; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; }
    .app-container { max-width: 450px; width: 100%; padding: 2rem; }
    
    /* Animations */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.3s ease-out; }

    /* Nav */
    .nav { display: flex; justify-content: center; gap: 0.5rem; margin-bottom: 2.5rem; }
    .nav-btn { background: none; border: none; font-size: 0.7rem; letter-spacing: 0.05em; text-transform: uppercase; color: #a1a1aa; cursor: pointer; padding: 0.5rem; transition: color 0.2s; }
    .nav-btn.active { color: var(--text); font-weight: 600; }

    /* UI Elements */
    h1 { font-size: 1.25rem; font-weight: 500; margin-bottom: 1.5rem; }
    .btn { background: var(--text); color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 8px; cursor: pointer; font-size: 0.8rem; transition: transform 0.1s, opacity 0.2s; }
    .btn:active { transform: scale(0.98); }
    .btn:hover { opacity: 0.9; }
    input { width: 100%; padding: 0.8rem; border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 1rem; font-size: 0.9rem; outline: none; }
    input:focus { border-color: var(--text); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const MindfulnessApp = () => {
      const [focus, setFocus] = useState(localStorage.getItem('dailyFocus') || "");
      const [isActive, setIsActive] = useState(false);
      const [interval, setIntervalTime] = useState(30);

      const toggleBell = () => {
        if (isActive) setIsActive(false); 
        else {
          setIsActive(true);
          const notify = () => {
            if (Notification.permission === 'granted') new Notification("Thuli", { body: "Pause for 10 seconds." });
            else alert("Thuli: Pause for 10 seconds.");
          };
          setInterval(notify, interval * 60000);
        }
      };

      return (
        <div className="fade-in">
          <h1>Daily Intention</h1>
          <input value={focus} onChange={(e) => { setFocus(e.target.value); localStorage.setItem('dailyFocus', e.target.value); }} placeholder="What is your focus today?" />
          <h1 style={{marginTop: '2rem'}}>Meditation Bell</h1>
          <div style={{display:'flex', gap:'10px', marginBottom:'1rem'}}>
            {[30, 60, 90].map(m => <button key={m} className={`nav-btn ${interval===m ? 'active' : ''}`} onClick={()=>setIntervalTime(m)}>{m}m</button>)}
          </div>
          <button className="btn" onClick={toggleBell}>{isActive ? 'Stop Bell' : 'Start Timer'}</button>
        </div>
      );
    };

    const JournalApp = () => {
      const [locked, setLocked] = useState(true);
      const [pin, setPin] = useState("");
      const [entries, setEntries] = useState(JSON.parse(localStorage.getItem('journal') || "[]"));
      const [text, setText] = useState("");

      const verify = (e) => { e.preventDefault(); if(pin === (localStorage.getItem('jPin') || "1234")) setLocked(false); else alert("Invalid PIN"); };
      
      if(locked) return <div className="fade-in"><h1>Journal</h1><input type="password" value={pin} onChange={(e)=>setPin(e.target.value)} placeholder="Enter PIN (1234)" /><button className="btn" onClick={verify}>Unlock Journal</button></div>;

      return (
        <div className="fade-in">
          <h1>Journal</h1>
          <form onSubmit={(e)=>{e.preventDefault(); const n=[{text, date: new Date().toLocaleDateString()}, ...entries]; setEntries(n); localStorage.setItem('journal', JSON.stringify(n)); setText(""); }}>
            <input value={text} onChange={(e)=>setText(e.target.value)} placeholder="Write something..." />
            <button className="btn">Add Entry</button>
          </form>
          {entries.map((e,i) => <div key={i} style={{marginTop:'1rem', fontSize:'0.9rem', color:'#4b5563'}}><b>{e.date}</b>: {e.text}</div>)}
        </div>
      );
    };

    const CoinApp = () => {
      const [mode, setMode] = useState('single');
      const [res, setRes] = useState('Tap Coin');
      const [score, setScore] = useState({a:0, b:0});
      const [flipping, setFlipping] = useState(false);

      const flip = () => {
        setFlipping(true);
        setTimeout(() => {
          setFlipping(false);
          const out = Math.random() > 0.5 ? 'Head' : 'Tails';
          setRes(out);
          if(mode === 'bo3') out === 'Head' ? setScore(s => ({...s, a: s.a+1})) : setScore(s => ({...s, b: s.b+1}));
        }, 600);
      };

      return (
        <div className="fade-in" style={{textAlign: 'center'}}>
          <h1>Decision Coin</h1>
          <div style={{marginBottom:'1rem'}}>
             <button className={`nav-btn ${mode==='single'?'active':''}`} onClick={()=>setMode('single')}>Single</button>
             <button className={`nav-btn ${mode==='bo3'?'active':''}`} onClick={()=>setMode('bo3')}>Best of 3</button>
          </div>
          <div onClick={flip} style={{fontSize:'3rem', cursor:'pointer', padding:'2rem', opacity: flipping ? 0.5 : 1}}>{res}</div>
          {mode === 'bo3' && <p>Head: {score.a} | Tails: {score.b}</p>}
        </div>
      );
    };

    const WaterApp = () => {
      const [ml, setMl] = useState(parseInt(localStorage.getItem('water') || 0));
      return (
        <div className="fade-in">
          <h1>Water Tracker</h1>
          <div style={{fontSize:'3rem', marginBottom:'1rem'}}>{ml}ml</div>
          <div style={{display:'flex', gap:'10px'}}>
            <button className="btn" onClick={()=>{const n=ml+250; setMl(n); localStorage.setItem('water',n);}}>+ 250ml</button>
            <button className="btn" style={{background:'#ef4444'}} onClick={()=>{setMl(0); localStorage.setItem('water',0);}}>Reset</button>
          </div>
        </div>
      );
    };

    const App = () => {
      const [tab, setTab] = useState('mindfulness');
      return (
        <div className="app-container">
          <header style={{textAlign:'center', marginBottom:'2rem'}}>
            <div style={{fontSize:'0.7rem', textTransform:'uppercase', letterSpacing:'0.2em', color:'#a1a1aa'}}>Thuli</div>
          </header>
          <nav className="nav">
            {['mindfulness', 'journal', 'coin', 'water'].map(t => (
              <button key={t} className={`nav-btn ${tab === t ? 'active' : ''}`} onClick={() => setTab(t)}>{t.toUpperCase()}</button>
            ))}
          </nav>
          {tab === 'mindfulness' && <MindfulnessApp />}
          {tab === 'journal' && <JournalApp />}
          {tab === 'coin' && <CoinApp />}
          {tab === 'water' && <WaterApp />}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
